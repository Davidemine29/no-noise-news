<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Nise News - Verification Dashboard</title>
  
  <style>
    /* RESET E STILI BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      padding: 20px;
    }

    /* CONTENITORE PRINCIPALE FEED */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      color: #0d6efd;
      font-size: 1.8rem;
    }

    /* CARDS DELLE NOTIZIE CON IMMAGINI */
    .news-card {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-left: 5px solid #198754;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background-color: #e9ecef;
    }

    .news-content {
      padding: 20px 24px;
    }

    .news-card .badge {
      display: inline-block;
      background-color: #e8f5e9;
      color: #198754;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .news-card h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #111;
      line-height: 1.3;
    }

    .news-card p {
      color: #33373d;
      font-size: 0.98rem;
      line-height: 1.55;
    }

    /* CARICAMENTO IN FONDO (INFINITE SCROLL) */
    .loading-sentinel {
      text-align: center;
      padding: 25px 0;
      color: #6c757d;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* PULSANTE AGGIORNA FIXED IN BASSO A DESTRA */
    .btn-refresh-fixed {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 14px 24px;
      background-color: #0d6efd;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;

      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(13, 110, 253, 0.39);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-refresh-fixed:hover {
      background-color: #0b5ed7;
      transform: translateY(-2px);
    }

    .btn-refresh-fixed:active {
      transform: translateY(0);
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>No Nise News</h1>
      <p>Feed notizie verificate e analisi anti-disinformazione</p>
    </header>

    <!-- FEED NEWS COMPLETO -->
    <main id="news-feed"></main>

    <!-- Target per l'Intersection Observer (infinite scroll) -->
    <div id="sentinel" class="loading-sentinel">
      <span>Caricamento nuove analisi in corso...</span>
    </div>
  </div>

  <!-- PULSANTE AGGIORNA FIXED -->
  <button id="refresh-btn" class="btn-refresh-fixed" onclick="handleRefresh()">
    <span id="refresh-icon">🔄</span>
    <span>Aggiorna news</span>
  </button>

  <script>
    // MATRICE TEMATICA PER GENERAZIONE INFINITA DI ARTICOLI COERENTI
    const newsDatabase = [
      {
        topic: "ai",
        title: "Verifica fonti su intelligenza artificiale e deepfake nei media",
        summary: "I laboratori di fact-checking hanno identificato una nuova campagna di contenuti sintetici generati per alterare le dichiarazioni pubbliche. Il modello di analisi basato su filigrana digitale e verifica spettrale delle frequenze vocali ha confermato la falsificazione dei filmati analizzati nelle ultime 48 ore, ripristinando la tracciabilità della fonte originale.",
        imageUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=700&q=80"
      },
      {
        topic: "weather",
        title: "Smentita la circolare d'allarme sui report meteorologici regionali",
        summary: "In seguito alla rapida diffusione di bollettini non ufficiali riguardanti eventi climatici estremi, la rete di monitoraggio ambientale ha pubblicato i dati radar grezzi. L'analisi incrociata tra stazioni terra ed elaborazioni satellitari mostra valori rientranti nelle medie stagionali, smentendo i grafici alterati distribuiti sui canali social.",
        imageUrl: "https://images.unsplash.com/photo-1590055531615-f16d36ffe8ec?auto=format&fit=crop&w=700&q=80"
      },
      {
        topic: "cybersecurity",
        title: "Neutralizzata rete di profilazione e bot automatizzati",
        summary: "Un'operazione congiunta di sicurezza informatica ha bloccato un'infrastruttura di oltre 15.000 profili sintetici dedicati all'amplificazione artificiale di fake news di ambito economico. I bot sfruttavano algoritmi di ricondivisione a cascata per posizionare parole chiave fraudolente nei trend di ricerca principali.",
        imageUrl: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=700&q=80"
      },
      {
        topic: "health",
        title: "Analisi clinica indipendente smentisce il report virale su integratori",
        summary: "Un presunto studio scientifico privo di revisione tra pari affermava la pericolosità di alcuni trattamenti medici standard. Le verifiche condotte dagli istituti di sanità hanno dimostrato la falsificazione dei campioni statistici citati nella pubblicazione, confermando l'assoluta validità delle linee guida ufficiali vigente.",
        imageUrl: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=700&q=80"
      },
      {
        topic: "finance",
        title: "Chiarimento dell'organismo di controllo sulle speculazioni di mercato",
        summary: "Dopo il panico generato da un documento di bilancio contraffatto diffuso su piattaforme di trading, gli organi di vigilanza hanno rilasciato il prospetto finanziario autenticato tramite tecnologia blockchain. Il titolo interessato ha ripreso la regolare quotazione dopo il blocco cauzionale di tutela.",
        imageUrl: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=700&q=80"
      },
      {
        topic: "energy",
        title: "Report di sostenibilità: smentite le stime alterate sulle fonti di rete",
        summary: "Un'analisi dettagliata sui flussi energetici regionali ha smentito le notizie circolate in merito all'inefficienza degli impianti rinnovabili di nuova installazione. I dati effettivi registrano una stabilità della rete superiore del 18% rispetto ai dati diffusi dai blog non verificati.",
        imageUrl: "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=700&q=80"
      }
    ];

    let generatedCount = 0;
    let isLoading = false;

    // Genera una card notizia con immagine pertinata e riassunto corposo
    function createNewsCard(item, instanceId) {
      const article = document.createElement('article');
      article.className = 'news-card';

      article.innerHTML = `
        <img class="news-image" src="${item.imageUrl}" alt="${item.title}" loading="lazy">
        <div class="news-content">
          <span class="badge">Verificato #${instanceId}</span>
          <h2>${item.title}</h2>
          <p>${item.summary}</p>
        </div>
      `;
      return article;
    }

    // ALGORITMO DI SCROLL INFINITO REALE (Generatore continuativo)
    function loadMoreNews(count = 2) {
      if (isLoading) return;
      isLoading = true;

      const feed = document.getElementById('news-feed');

      setTimeout(() => {
        for (let i = 0; i < count; i++) {
          generatedCount++;
          // Seleziona la base tematica a rotazione senza mai esaurirsi
          const baseTopic = newsDatabase[(generatedCount - 1) % newsDatabase.length];
          
          feed.appendChild(createNewsCard(baseTopic, generatedCount));
        }
        isLoading = false;
      }, 400);
    }

    // Gestione click pulsante "Aggiorna news" (Reset + Ricaricamento)
    function handleRefresh() {
      const icon = document.getElementById('refresh-icon');
      const feed = document.getElementById('news-feed');
      
      icon.classList.add('spin');
      
      setTimeout(() => {
        feed.innerHTML = '';
        generatedCount = 0;
        loadMoreNews(3);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        icon.classList.remove('spin');
      }, 600);
    }

    // Inizializzazione Intersection Observer per Infinite Scroll senza limiti
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
          loadMoreNews(2);
        }
      });
    }, {
      rootMargin: '250px' // Attiva il caricamento 250px prima della fine
    });

    // Avvio iniziale
    document.addEventListener('DOMContentLoaded', () => {
      loadMoreNews(3);
      observer.observe(document.getElementById('sentinel'));
    });
  </script>

</body>
</html>
