<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Nise News - Verification Dashboard</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      color: #0d6efd;
      font-size: 1.8rem;
    }

    .news-card {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-left: 5px solid #198754;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background-color: #e9ecef;
    }

    .news-content {
      padding: 20px 24px;
    }

    .news-card .badge {
      display: inline-block;
      background-color: #e8f5e9;
      color: #198754;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .news-card .hashtags {
      display: block;
      color: #0d6efd;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 10px;
    }

    .news-card h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #111;
      line-height: 1.3;
    }

    .news-card p {
      color: #33373d;
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .news-card a.read-more {
      display: inline-block;
      margin-top: 12px;
      color: #0d6efd;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .news-card a.read-more:hover {
      text-decoration: underline;
    }

    .loading-sentinel {
      text-align: center;
      padding: 25px 0;
      color: #6c757d;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .btn-refresh-fixed {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background-color: #0d6efd;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(13, 110, 253, 0.39);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-refresh-fixed:hover {
      background-color: #0b5ed7;
      transform: translateY(-2px);
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>No Nise News</h1>
      <p>Feed notizie verificate e analisi anti-disinformazione</p>
    </header>

    <main id="news-feed"></main>

    <div id="sentinel" class="loading-sentinel">
      <span id="sentinel-text">Caricamento notizie...</span>
    </div>
  </div>

  <button id="refresh-btn" class="btn-refresh-fixed" onclick="handleRefresh()">
    <span id="refresh-icon">🔄</span>
    <span>Sincronizza Feed</span>
  </button>

  <script>
    let currentPage = 1;
    let isLoading = false;
    let hasMoreArticles = true;
    const loadedArticleUrls = new Set();

    function createNewsCard(article) {
      const card = document.createElement('article');
      card.className = 'news-card';

      card.innerHTML = `
        <img class="news-image" 
             src="${article.image_url}" 
             alt="${article.title}" 
             loading="lazy"
             onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=60'">
        <div class="news-content">
          <span class="badge">${article.category}</span>
          <h2>${article.title}</h2>
          <p>${article.content}</p>
          <span class="hashtags">${article.hashtags}</span>
          <a class="read-more" href="${article.url}" target="_blank" rel="noopener noreferrer">Leggi fonte originale →</a>
        </div>
      `;
      return card;
    }

    async function loadMoreNews() {
      if (isLoading || !hasMoreArticles) return;
      isLoading = true;

      const sentinelText = document.getElementById('sentinel-text');
      sentinelText.textContent = "Caricamento notizie dal server...";

      try {
        const response = await fetch(`/api/articles?page=${currentPage}&limit=5`);
        const data = await response.json();

        if (data.articles && data.articles.length > 0) {
          const feed = document.getElementById('news-feed');
          
          data.articles.forEach(article => {
            if (!loadedArticleUrls.has(article.url)) {
              loadedArticleUrls.add(article.url);
              feed.appendChild(createNewsCard(article));
            }
          });

          currentPage++;
          hasMoreArticles = data.has_more;
          
          if (!hasMoreArticles) {
            sentinelText.textContent = "Hai letto tutte le notizie disponibili.";
          } else {
            sentinelText.textContent = "Scorri per altre notizie...";
          }
        } else {
          hasMoreArticles = false;
          sentinelText.textContent = "Nessuna notizia nel database. Clicca su 'Sincronizza Feed'.";
        }
      } catch (error) {
        console.error("Errore nel recupero notizie:", error);
        sentinelText.textContent = "Errore di connessione al server.";
      } finally {
        isLoading = false;
      }
    }

    async function handleRefresh() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('spin');

      try {
        await fetch('/refresh', { 
          method: 'POST',
          headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        
        document.getElementById('news-feed').innerHTML = '';
        loadedArticleUrls.clear();
        currentPage = 1;
        hasMoreArticles = true;
        
        await loadMoreNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        console.error("Errore durante il refresh:", e);
      } finally {
        setTimeout(() => {
          icon.classList.remove('spin');
        }, 600);
      }
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading && hasMoreArticles) {
          loadMoreNews();
        }
      });
    }, { rootMargin: '250px' });

    document.addEventListener('DOMContentLoaded', () => {
      loadMoreNews();
      observer.observe(document.getElementById('sentinel'));
    });
  </script>

</body>
</html>
