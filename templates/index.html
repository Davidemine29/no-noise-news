<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Nise News - Verification Dashboard</title>
  
  <style>
    /* RESET E STILI BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      padding: 20px;
    }

    /* CONTENITORE PRINCIPALE FEED */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      color: #0d6efd;
      font-size: 1.8rem;
    }

    /* CARDS DELLE NOTIZIE CON IMMAGINI */
    .news-card {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-left: 5px solid #198754;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background-color: #e9ecef;
    }

    .news-content {
      padding: 20px 24px;
    }

    .news-card .badge {
      display: inline-block;
      background-color: #e8f5e9;
      color: #198754;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .news-card h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #111;
      line-height: 1.3;
    }

    .news-card p {
      color: #33373d;
      font-size: 0.98rem;
      line-height: 1.55;
    }

    /* CARICAMENTO IN FONDO (INFINITE SCROLL) */
    .loading-sentinel {
      text-align: center;
      padding: 25px 0;
      color: #6c757d;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* PULSANTE AGGIORNA FIXED IN BASSO A DESTRA */
    .btn-refresh-fixed {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 14px 24px;
      background-color: #0d6efd;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;

      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(13, 110, 253, 0.39);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-refresh-fixed:hover {
      background-color: #0b5ed7;
      transform: translateY(-2px);
    }

    .btn-refresh-fixed:active {
      transform: translateY(0);
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>No Nise News</h1>
      <p>Feed notizie verificate e analisi anti-disinformazione</p>
    </header>

    <!-- FEED NEWS COMPLETO -->
    <main id="news-feed"></main>

    <!-- Target per l'Intersection Observer (infinite scroll) -->
    <div id="sentinel" class="loading-sentinel">
      <span>Generazione nuove verifiche in corso...</span>
    </div>
  </div>

  <!-- PULSANTE AGGIORNA FIXED -->
  <button id="refresh-btn" class="btn-refresh-fixed" onclick="handleRefresh()">
    <span id="refresh-icon">🔄</span>
    <span>Aggiorna news</span>
  </button>

  <script>
    // MATRICI PER LA GENERAZIONE PROCEDURALE ANTI-FAKE NEWS
    const topics = [
      { name: "Intelligenza Artificiale", tag: "technology", imgKeyword: "computer,tech" },
      { name: "Sostenibilità Ambientale", tag: "environment", imgKeyword: "nature,forest" },
      { name: "Sicurezza Informatica", tag: "security", imgKeyword: "code,data" },
      { name: "Mercati Finanziari", tag: "finance", imgKeyword: "city,business" },
      { name: "Salute e Medicina", tag: "health", imgKeyword: "science,laboratory" },
      { name: "Automotive ed Energia", tag: "energy", imgKeyword: "car,energy" }
    ];

    const triggers = [
      "Smentita la circolare virale su ipotetici rischi imminenti",
      "Analisi indipendente chiarisce l'inconsistenza dei report circolati",
      "Rilevato un nuovo pattern di disinformazione coordinata",
      "Verifica delle fonti sui dati difformi diffusi nelle ultime ore",
      "Neutralizzata campagna di notizie alterate ad alto impatto"
    ];

    const methods = [
      "I controlli incrociati condotti dai laboratori di fact-checking mediante analisi spettrale e verifica dei registri ufficiali",
      "L'esame dei dati grezzi estratti dai sensori di monitoraggio e validati da enti terzi indipendenti",
      "L'audit tecnico eseguito sugli algoritmi di distribuzione delle notizie e sulle catene di tracciabilità digitale",
      "Il confronto sistematico tra i report preliminari non verificati e i protocolli ufficiali approvati"
    ];

    const impacts = [
      "hanno confermato la completa manipolazione dei contenuti, ripristinando la corretta ricostruzione dei fatti.",
      "hanno evidenziato una percentuale di errore nei dati diffusi superiore all'80%, smentendo ogni allarme.",
      "hanno permesso di identificare la fonte originaria della falsificazione e di chiarire la natura del malinteso.",
      "hanno dimostrato l'assoluta conformità degli standard di sicurezza vigenti rispetto alle voci smentite."
    ];

    // Registro combinazioni già generate per evitare qualsiasi duplicato
    const generatedHashes = new Set();
    let globalCounter = 0;
    let isLoading = false;

    // ALGORITMO PROCEDURALE ANTI-REPETIZIONE
    function generateUniqueArticle() {
      let topic, trigger, method, impact, hash;
      let attempts = 0;

      // Continua a ciclare finché non trova una combinazione mai creata prima
      do {
        topic = topics[Math.floor(Math.random() * topics.length)];
        trigger = triggers[Math.floor(Math.random() * triggers.length)];
        method = methods[Math.floor(Math.random() * methods.length)];
        impact = impacts[Math.floor(Math.random() * impacts.length)];
        
        hash = `${topic.name}-${trigger.substring(0, 10)}-${method.substring(0, 10)}`;
        attempts++;
      } while (generatedHashes.has(hash) && attempts < 100);

      generatedHashes.add(hash);
      globalCounter++;

      const title = `${topic.name}: ${trigger}`;
      const summary = `${method} ${impact} L'analisi dettagliata conferma l'importanza di fare riferimento esclusivo a canali d'informazione certificati.`;
      
      // Generazione immagine pertinente tramite Unsplash con lock per evitare immagini identiche
      const imageUrl = `https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=700&q=80`;
      const dynamicImgUrl = `https://loremflickr.com/700/350/${topic.imgKeyword}?lock=${globalCounter}`;

      return {
        id: globalCounter,
        title: title,
        summary: summary,
        image: dynamicImgUrl
      };
    }

    // Costruisce la carta della notizia
    function createNewsCard(item) {
      const article = document.createElement('article');
      article.className = 'news-card';

      article.innerHTML = `
        <img class="news-image" 
             src="${item.image}" 
             alt="${item.title}" 
             loading="lazy"
             onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=700&q=80'">
        <div class="news-content">
          <span class="badge">Fact-Check #${item.id}</span>
          <h2>${item.title}</h2>
          <p>${item.summary}</p>
        </div>
      `;
      return article;
    }

    // Caricamento asincrono al raggiungimento del fondo della pagina
    function loadMoreNews(count = 2) {
      if (isLoading) return;
      isLoading = true;

      const feed = document.getElementById('news-feed');

      setTimeout(() => {
        for (let i = 0; i < count; i++) {
          const newArticle = generateUniqueArticle();
          feed.appendChild(createNewsCard(newArticle));
        }
        isLoading = false;
      }, 400);
    }

    // Pulsante "Aggiorna news": svuota il feed e genera nuovi articoli
    function handleRefresh() {
      const icon = document.getElementById('refresh-icon');
      const feed = document.getElementById('news-feed');
      
      icon.classList.add('spin');
      feed.innerHTML = '';
      
      loadMoreNews(3);
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => {
        icon.classList.remove('spin');
      }, 600);
    }

    // Observer per lo scroll infinito
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
          loadMoreNews(2);
        }
      });
    }, {
      rootMargin: '250px'
    });

    // Inizializzazione
    document.addEventListener('DOMContentLoaded', () => {
      loadMoreNews(3);
      observer.observe(document.getElementById('sentinel'));
    });
  </script>

</body>
</html>
