<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Nise News - Verification Dashboard</title>
  
  <style>
    /* RESET E STILI BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      padding: 20px;
    }

    /* CONTENITORE PRINCIPALE FEED */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      color: #0d6efd;
      font-size: 1.8rem;
    }

    /* CARDS DELLE NOTIZIE CON IMMAGINI */
    .news-card {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      border-left: 5px solid #198754;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background-color: #e9ecef;
    }

    .news-content {
      padding: 16px 20px;
    }

    .news-card .badge {
      display: inline-block;
      background-color: #e8f5e9;
      color: #198754;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .news-card h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #111;
    }

    .news-card p {
      color: #4b4f56;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* CARICAMENTO IN FONDO (INFINITE SCROLL) */
    .loading-sentinel {
      text-align: center;
      padding: 20px 0;
      color: #6c757d;
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* PULSANTE AGGIORNA FIXED IN BASSO A DESTRA */
    .btn-refresh-fixed {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 14px 24px;
      background-color: #0d6efd;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;

      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(13, 110, 253, 0.39);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-refresh-fixed:hover {
      background-color: #0b5ed7;
      transform: translateY(-2px);
    }

    .btn-refresh-fixed:active {
      transform: translateY(0);
    }

    /* ANIMAZIONE ROTAZIONE ICONA */
    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>No Nise News</h1>
      <p>Feed notizie verificate anti-fake news</p>
    </header>

    <!-- FEED NEWS COMPLETO -->
    <main id="news-feed"></main>

    <!-- Target per l'Intersection Observer (infinite scroll) -->
    <div id="sentinel" class="loading-sentinel">
      <span id="sentinel-text">Caricamento nuove notizie...</span>
    </div>
  </div>

  <!-- PULSANTE AGGIORNA FIXED -->
  <button id="refresh-btn" class="btn-refresh-fixed" onclick="handleRefresh()">
    <span id="refresh-icon">🔄</span>
    <span>Aggiorna news</span>
  </button>

  <script>
    // ARCHIVIO REALE NOTIZIE (Dal presente al passato)
    const newsArchive = [
      { id: 101, title: "Rilevato nuovo pattern di disinformazione sui social", summary: "Analisi automatizzata sulle fonti secondarie confermano l'inconsistenza dei dati circolati nelle ultime 24 ore.", category: "tech" },
      { id: 102, title: "Aggiornamento algoritmi di fact-checking", summary: "Il modello di verifica incrociata ha ridotto i falsi positivi del 14% nel monitoraggio delle notizie locali.", category: "computer" },
      { id: 103, title: "Verifica fonti su intelligenza artificiale e deepfake", summary: "Impostati nuovi standard di filigrana digitale per identificare video manipolati nelle notizie di cronaca.", category: "code" },
      { id: 104, title: "Analisi dati sui report meteorologici alterati", summary: "Smentita la circolare riguardante gli eventi estremi non tracciati dai radar ufficiali.", category: "weather" },
      { id: 105, title: "Sicurezza informatica nelle reti di informazione", summary: "Nuovi standard adottati per garantire l'autenticità delle immagini giornalistiche alla fonte.", category: "security" },
      { id: 106, title: "Fact-checking sui dati di transizione energetica", summary: "L'analisi indipendente smentisce le stime diffuse dai blog non certificati sui consumi di rete.", category: "city" },
      { id: 107, title: "Smentita la bufala scientifica sulla salute pubblica", summary: "I report clinici ufficiali confermano l'infondatezza delle voci circolate sui canali di messaggistica.", category: "science" },
      { id: 108, title: "Rilevamento reti bot su piattaforme social", summary: "Disattivati oltre ventimila profili automatizzati responsabili della condivisione di articoli civetta.", category: "network" },
      { id: 109, title: "Analisi di veridicità sui mercati finanziari", summary: "Gli organismi di controllo chiariscono la natura del report speculativo diffuso in mattinata.", category: "business" },
      { id: 110, title: "Monitoraggio satellitare contro la disinformazione", summary: "Le immagini ad alta risoluzione smentiscono le ricostruzioni grafiche alterate degli eventi locali.", category: "space" },
      { id: 111, title: "Archivio 2025: Verifica dichiarazioni settore automotive", summary: "Analisi dei dati storici rilasciati sui test di emissione ed efficienza batterie.", category: "car" },
      { id: 112, title: "Archivio 2024: Revisione storiche notizie su scoperte archeologiche", summary: "Rettifica sui reperti rinvenuti in area mediterranea a seguito di datazione al carbonio.", category: "history" }
    ];

    // REGISTRO DEGLI ARTICOLI GIÀ MOSTRATI (Impedisce qualsiasi duplicato)
    const displayedArticleIds = new Set();
    let isLoading = false;

    // Genera una singola card notizia con fallback immagine sicuro
    function createNewsCard(item) {
      const article = document.createElement('article');
      article.className = 'news-card';
      
      // Immagine sicura via LoremFlickr basata sulla categoria dell'articolo + ID unico
      const imageUrl = `https://loremflickr.com/700/350/${item.category}?lock=${item.id}`;

      article.innerHTML = `
        <img class="news-image" 
             src="${imageUrl}" 
             alt="${item.title}" 
             loading="lazy"
             onerror="this.src='https://via.placeholder.com/700x350/0d6efd/ffffff?text=No+Nise+News'">
        <div class="news-content">
          <span class="badge">Verificato</span>
          <h2>${item.title}</h2>
          <p>${item.summary}</p>
        </div>
      `;
      return article;
    }

    // ALGORITMO DI ESTRAZIONE ARTICOLI (Senza ripetizioni)
    function fetchUniqueArticles(count = 3) {
      const availableArticles = newsArchive.filter(article => !displayedArticleIds.has(article.id));
      
      // Se finiscono gli articoli nell'archivio
      if (availableArticles.length === 0) {
        return [];
      }

      // Mescola e prende gli articoli non ancora mostrati
      const shuffled = [...availableArticles].sort(() => Math.random() - 0.5);
      const selected = shuffled.slice(0, count);

      // Registra gli ID estratti
      selected.forEach(article => displayedArticleIds.add(article.id));
      return selected;
    }

    // Caricamento nuove notizie nel feed
    function loadMoreNews(count = 3) {
      if (isLoading) return;
      isLoading = true;

      const feed = document.getElementById('news-feed');
      const sentinelText = document.getElementById('sentinel-text');
      
      setTimeout(() => {
        const nextArticles = fetchUniqueArticles(count);

        if (nextArticles.length > 0) {
          nextArticles.forEach(item => {
            feed.appendChild(createNewsCard(item));
          });
        } else {
          sentinelText.textContent = "Hai raggiunto la fine dell'archivio notizie verificate.";
        }

        isLoading = false;
      }, 500);
    }

    // Gestione click pulsante "Aggiorna news" (Reset + Ricaricamento)
    function handleRefresh() {
      const icon = document.getElementById('refresh-icon');
      const feed = document.getElementById('news-feed');
      const sentinelText = document.getElementById('sentinel-text');
      
      icon.classList.add('spin');
      
      setTimeout(() => {
        // Reset totale per permettere un nuovo giro di estrazione
        feed.innerHTML = '';
        displayedArticleIds.clear();
        sentinelText.textContent = "Caricamento nuove notizie...";

        loadMoreNews(3);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        icon.classList.remove('spin');
      }, 600);
    }

    // Inizializzazione Intersection Observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
          loadMoreNews(3);
        }
      });
    }, {
      rootMargin: '150px'
    });

    // Avvio al caricamento della pagina
    document.addEventListener('DOMContentLoaded', () => {
      loadMoreNews(3);
      observer.observe(document.getElementById('sentinel'));
    });
  </script>

</body>
</html>
