<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News dal Futuro - Il tuo Radar sulle Tecnologie di Domani</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    /* HEADER & LOGO */
    header {
      margin-bottom: 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 41, 59, 0.7);
      padding: 12px 24px;
      border-radius: 50px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
    }

    header h1 {
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* CARDS NOTIZIE FUTURISTICHE */
    .news-card {
      background-color: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
      animation: fadeIn 0.4s ease-in-out;
      transition: transform 0.2s ease;
    }

    .news-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      background-color: #0f172a;
    }

    .news-content {
      padding: 20px 24px;
    }

    .news-card .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .news-card .hashtags {
      display: block;
      color: #818cf8;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 12px;
    }

    .news-card h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #f8fafc;
      line-height: 1.35;
    }

    .news-card p {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .news-card a.read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: gap 0.2s ease;
    }

    .news-card a.read-more:hover {
      gap: 10px;
      color: #7dd3fc;
    }

    .loading-sentinel {
      text-align: center;
      padding: 25px 0;
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* PULSANTE AGGIORNA FLOATING */
    .btn-refresh-fixed {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-refresh-fixed:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(2, 132, 199, 0.6);
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <!-- LOGO VETTORIALE SVG (Atom & Pulse) -->
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" fill="#38bdf8"/>
          <ellipse cx="12" cy="12" rx="9" ry="4" stroke="#818cf8" stroke-width="1.5" transform="rotate(30 12 12)"/>
          <ellipse cx="12" cy="12" rx="9" ry="4" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-30 12 12)"/>
        </svg>
        <h1>News dal Futuro</h1>
      </div>
      <p>Il radar in tempo reale su Intelligenza Artificiale, Calcolo Quantistico e Cripto</p>
    </header>

    <main id="news-feed"></main>

    <div id="sentinel" class="loading-sentinel">
      <span id="sentinel-text">Caricamento notizie dal futuro...</span>
    </div>
  </div>

  <button id="refresh-btn" class="btn-refresh-fixed" onclick="handleRefresh()">
    <span id="refresh-icon">⚡</span>
    <span>Sincronizza Radar</span>
  </button>

  <script>
    let currentPage = 1;
    let isLoading = false;
    let hasMoreArticles = true;
    const loadedArticleUrls = new Set();

    function createNewsCard(article) {
      const card = document.createElement('article');
      card.className = 'news-card';

      card.innerHTML = `
        <img class="news-image" 
             src="${article.image_url}" 
             alt="${article.title}" 
             loading="lazy"
             onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=60'">
        <div class="news-content">
          <span class="badge">${article.category}</span>
          <h2>${article.title}</h2>
          <p>${article.content}</p>
          <span class="hashtags">${article.hashtags}</span>
          <a class="read-more" href="${article.url}" target="_blank" rel="noopener noreferrer">
            Leggi articolo originale <span>→</span>
          </a>
        </div>
      `;
      return card;
    }

    async function loadMoreNews() {
      if (isLoading || !hasMoreArticles) return;
      isLoading = true;

      const sentinelText = document.getElementById('sentinel-text');
      sentinelText.textContent = "Connessione alle fonti in corso...";

      try {
        const response = await fetch(`/api/articles?page=${currentPage}&limit=5`);
        const data = await response.json();

        if (data.articles && data.articles.length > 0) {
          const feed = document.getElementById('news-feed');
          
          data.articles.forEach(article => {
            if (!loadedArticleUrls.has(article.url)) {
              loadedArticleUrls.add(article.url);
              feed.appendChild(createNewsCard(article));
            }
          });

          currentPage++;
          hasMoreArticles = data.has_more;
          
          if (!hasMoreArticles) {
            sentinelText.textContent = "Hai consultato tutti i report disponibili.";
          } else {
            sentinelText.textContent = "Scorri per esplorare altre notizie...";
          }
        } else {
          hasMoreArticles = false;
          sentinelText.textContent = "Nessun report trovato. Clicca su 'Sincronizza Radar'.";
        }
      } catch (error) {
        console.error("Errore nel recupero notizie:", error);
        sentinelText.textContent = "Errore di connessione al server.";
      } finally {
        isLoading = false;
      }
    }

    async function handleRefresh() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('spin');

      try {
        await fetch('/refresh', { 
          method: 'POST',
          headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        
        document.getElementById('news-feed').innerHTML = '';
        loadedArticleUrls.clear();
        currentPage = 1;
        hasMoreArticles = true;
        
        await loadMoreNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        console.error("Errore durante il refresh:", e);
      } finally {
        setTimeout(() => {
          icon.classList.remove('spin');
        }, 600);
      }
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading && hasMoreArticles) {
          loadMoreNews();
        }
      });
    }, { rootMargin: '250px' });

    document.addEventListener('DOMContentLoaded', () => {
      loadMoreNews();
      observer.observe(document.getElementById('sentinel'));
    });
  </script>

</body>
</html>
