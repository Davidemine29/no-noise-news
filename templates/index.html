<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Noise News | Tech, Quantum, Finance & Crypto</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --hashtag-color: #818cf8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        .btn-refresh {
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            opacity: 0.9;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #0f172a;
        }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.15rem;
            line-height: 1.4;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .card-description {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-hashtags {
            font-size: 0.85rem;
            color: var(--hashtag-color);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: auto;
        }

        .card-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .card-link:hover {
            text-decoration: underline;
        }

        .card-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>⚡ No Noise News</h1>
        <a href="/refresh" class="btn-refresh">🔄 Aggiorna Notizie</a>
    </div>

    <div class="grid">
        {% for article in articles %}
        <div class="card">
            <!-- IMMAGINE REALE -->
            <img src="{{ article.image_url }}" alt="News Image" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'">
            
            <div class="card-body">
                <!-- CATEGORIA -->
                <span class="card-category">{{ article.category }}</span>
                
                <!-- TITOLO -->
                <h2 class="card-title">{{ article.title }}</h2>
                
                <!-- DESCRIZIONE CON INVITO AL CLICK -->
                <p class="card-description">{{ article.content }}</p>
                
                <!-- HASHTAG DELL'ARTICOLO -->
                <div class="card-hashtags">{{ article.hashtags }}</div>
                
                <!-- FOOTER CARD -->
                <div class="card-footer">
                    <a href="{{ article.url }}" target="_blank" class="card-link">Leggi su Fonte Ufficiale &rarr;</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
