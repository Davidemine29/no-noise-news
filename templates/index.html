<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Nise News - Verification Dashboard</title>
  
  <style>
    /* STILI BASE E RESET */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      padding: 20px;
    }

    /* CONTENITORE PRINCIPALE FEED */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      color: #0d6efd;
      font-size: 1.8rem;
    }

    /* CARDS DELLE NOTIZIE CON IMMAGINI */
    .news-card {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      border-left: 5px solid #198754;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background-color: #e9ecef;
    }

    .news-content {
      padding: 16px 20px;
    }

    .news-card .badge {
      display: inline-block;
      background-color: #e8f5e9;
      color: #198754;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .news-card h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #111;
    }

    .news-card p {
      color: #4b4f56;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* CARICAMENTO IN FONDO (INFINITE SCROLL) */
    .loading-sentinel {
      text-align: center;
      padding: 20px 0;
      color: #6c757d;
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* PULSANTE AGGIORNA FIXED IN BASSO A DESTRA */
    .btn-refresh-fixed {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 14px 24px;
      background-color: #0d6efd;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;

      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(13, 110, 253, 0.39);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-refresh-fixed:hover {
      background-color: #0b5ed7;
      transform: translateY(-2px);
    }

    .btn-refresh-fixed:active {
      transform: translateY(0);
    }

    /* ANIMAZIONE ROTAZIONE ICONA */
    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>No Nise News</h1>
      <p>Feed notizie verificate anti-fake news</p>
    </header>

    <!-- FEED NEWS COMPLETO -->
    <main id="news-feed"></main>

    <!-- Target per l'Intersection Observer (infinite scroll) -->
    <div id="sentinel" class="loading-sentinel">
      <span>Caricamento nuove notizie...</span>
    </div>
  </div>

  <!-- PULSANTE AGGIORNA FIXED -->
  <button id="refresh-btn" class="btn-refresh-fixed" onclick="handleRefresh()">
    <span id="refresh-icon">🔄</span>
    <span>Aggiorna news</span>
  </button>

  <script>
    // Pool di notizie con immagini dinamiche Unsplash
    const newsTopics = [
      { title: "Verifica fonti su intelligenza artificiale e deepfake", summary: "Impostati nuovi standard di filigrana digitale per identificare video manipolati nelle notizie di cronaca.", query: "cybersecurity" },
      { title: "Fact-checking sui dati di transizione energetica", summary: "L'analisi indipendente smentisce le stime diffuse dai blog non certificati sui consumi di rete.", query: "energy" },
      { title: "Smentita la bufala scientifica sulla salute pubblica", summary: "I report clinici ufficiali confermano l'infondatezza delle voci circolate sui canali di messaggistica.", query: "science" },
      { title: "Rilevamento reti bot su piattaforme social", summary: "Disattivati oltre ventimila profili automatizzati responsabili della condivisione di articoli civetta.", query: "technology" },
      { title: "Analisi di veridicità sui mercati finanziari", summary: "Gli organismi di controllo chiariscono la natura del report speculativo diffuso in mattinata.", query: "finance" },
      { title: "Monitoraggio satellitare contro la disinformazione", summary: "Le immagini ad alta risoluzione smentiscono le ricostruzioni grafiche alterate degli eventi locali.", query: "satellite" }
    ];

    let isLoading = false;
    let articleIdCounter = 1;

    // Genera una singola card notizia
    function createNewsCard(item) {
      const article = document.createElement('article');
      article.className = 'news-card';
      
      // Usa l'API Unsplash Source per generare un'immagine unica correlata per ogni articolo
      const imageUrl = `https://picsum.photos/700/350?random=${articleIdCounter++}`;

      article.innerHTML = `
        <img class="news-image" src="${imageUrl}" alt="${item.title}" loading="lazy">
        <div class="news-content">
          <span class="badge">Verificato</span>
          <h2>${item.title}</h2>
          <p>${item.summary}</p>
        </div>
      `;
      return article;
    }

    // Funzione per caricare un blocco di nuove notizie nel feed
    function loadMoreNews(count = 3) {
      if (isLoading) return;
      isLoading = true;

      const feed = document.getElementById('news-feed');
      const sentinel = document.getElementById('sentinel');
      sentinel.style.opacity = '1';

      setTimeout(() => {
        for (let i = 0; i < count; i++) {
          const randomIndex = Math.floor(Math.random() * newsTopics.length);
          const topic = newsTopics[randomIndex];
          feed.appendChild(createNewsCard(topic));
        }
        isLoading = false;
      }, 600); // Ritardo simulato per la chiamata API
    }

    // Gestione click pulsante "Aggiorna news" (Reset + Ricaricamento top)
    function handleRefresh() {
      const icon = document.getElementById('refresh-icon');
      const feed = document.getElementById('news-feed');
      
      icon.classList.add('spin');
      
      setTimeout(() => {
        feed.innerHTML = '';
        articleIdCounter = Math.floor(Math.random() * 100);
        loadMoreNews(4);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        icon.classList.remove('spin');
      }, 800);
    }

    // Inizializzazione Intersection Observer per lo scroll infinito
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
          loadMoreNews(3);
        }
      });
    }, {
      rootMargin: '200px' // Inizia a caricare 200px prima di raggiungere la fine
    });

    // Avvio al caricamento della pagina
    document.addEventListener('DOMContentLoaded', () => {
      loadMoreNews(4); // Caricamento iniziale
      observer.observe(document.getElementById('sentinel'));
    });
  </script>

</body>
</html>
